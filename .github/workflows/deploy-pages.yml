name: Deploy Web (GitHub Pages + Cloudflare)

# Publishes the Wasm production bundle on every push to main, to GitHub Pages and (while we move over)
# to Cloudflare too, as an assets-only Worker. Both deploy the same build. GitHub Pages requires repo
# Settings → Pages → Build and deployment → Source = "GitHub Actions". Cloudflare needs the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (CI_CD.md → Web). For Google sign-in to work on
# a deployed site, add its origin (https://<owner>.github.io, https://<worker>.<subdomain>.workers.dev)
# to the Web OAuth client's authorised JavaScript origins (docs/google-cloud-setup.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build Wasm distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETWORTH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NETWORTH_GOOGLE_WEB_CLIENT_ID }}
      NETWORTH_GOOGLE_API_KEY: ${{ secrets.NETWORTH_GOOGLE_API_KEY }}
      NETWORTH_GOOGLE_PROJECT_NUMBER: ${{ secrets.NETWORTH_GOOGLE_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Wasm production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist
      # Assets-only Worker: no script, Cloudflare serves the bundle as static files.
      - name: Deploy to Cloudflare
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --assets=dist
            --name=${{ vars.CLOUDFLARE_WORKER_NAME || 'net-worth' }}
            --compatibility-date=2026-10-01
