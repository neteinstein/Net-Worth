name: Release

# Every push to main (and manual runs) builds the signed release of both Android flavors:
# - "github": the APK published as a GitHub Release tagged v1.0.<run number>, with R8's mapping file.
# - "playstore": the app bundle, attached to that Release and uploaded to the Play Console's internal
#   track when ANDROID_PUBLISHER_CREDENTIALS is set.
# iOS (TestFlight) is wired up but disabled until the IOS_RELEASE_ENABLED variable is "true".
# See CI_CD.md → Releases.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  VERSION_NAME: "1.0.${{ github.run_number }}"
  # Google sign-in client ids compiled into GoogleConfig (docs/google-cloud-setup.md). Optional: when
  # absent the app builds, and "Sign in with Google" says it isn't configured.
  NETWORTH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NETWORTH_GOOGLE_WEB_CLIENT_ID }}
  NETWORTH_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NETWORTH_GOOGLE_IOS_CLIENT_ID }}
  NETWORTH_GOOGLE_API_KEY: ${{ secrets.NETWORTH_GOOGLE_API_KEY }}
  NETWORTH_GOOGLE_PROJECT_NUMBER: ${{ secrets.NETWORTH_GOOGLE_PROJECT_NUMBER }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Fail fast, before spending CI time, if the signing secrets aren't set up (see CI_CD.md).
      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]} (see CI_CD.md → Releases)"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # PR Checks validated the PR branch, but a squash merge lands a commit on main that was never
      # itself built, so this is the only gate on the exact commit being released.
      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK (github) and app bundle (playstore)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew :androidApp:assembleGithubRelease :androidApp:bundlePlaystoreRelease --stacktrace

      # PR Checks runs this too, but a squash merge can land a shrinker change on main that was never
      # built as a release: re-check before anything reaches users.
      - name: Verify obfuscation
        run: ./scripts/verify-obfuscation.sh

      - name: Prepare release artifacts
        id: artifact
        run: |
          VERSION_UNDERSCORE="${VERSION_NAME//./_}"

          APK_PATH="androidApp/build/outputs/apk/github/release/NetWorth_version${VERSION_UNDERSCORE}-github.apk"
          mv androidApp/build/outputs/apk/github/release/androidApp-github-release.apk "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_sha1=$(sha1sum "$APK_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          # R8's rename table for this exact APK: without it a crash report from the build is
          # unreadable, and every build produces a different one.
          MAPPING_PATH="$RUNNER_TEMP/NetWorth_version${VERSION_UNDERSCORE}-github-mapping.txt"
          cp androidApp/build/outputs/mapping/githubRelease/mapping.txt "$MAPPING_PATH"
          echo "mapping_path=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

          # The Play bundle is copied, not moved: the Play upload below publishes Gradle's own output.
          AAB_PATH="$RUNNER_TEMP/NetWorth_version${VERSION_UNDERSCORE}-playstore.aab"
          cp androidApp/build/outputs/bundle/playstoreRelease/androidApp-playstore-release.aab "$AAB_PATH"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          PLAY_MAPPING_PATH="$RUNNER_TEMP/NetWorth_version${VERSION_UNDERSCORE}-playstore-mapping.txt"
          cp androidApp/build/outputs/mapping/playstoreRelease/mapping.txt "$PLAY_MAPPING_PATH"
          echo "play_mapping_path=$PLAY_MAPPING_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          APK_SHA1: ${{ steps.artifact.outputs.apk_sha1 }}
          MAPPING_PATH: ${{ steps.artifact.outputs.mapping_path }}
          AAB_PATH: ${{ steps.artifact.outputs.aab_path }}
          PLAY_MAPPING_PATH: ${{ steps.artifact.outputs.play_mapping_path }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "$APK_PATH" \
            "$MAPPING_PATH" \
            "$AAB_PATH" \
            "$PLAY_MAPPING_PATH" \
            --title "v${VERSION_NAME}" \
            --notes "**github flavor APK SHA-1:** \`${APK_SHA1}\`

          \`*-playstore.aab\` is the same release as the Play Store bundle. Each \`*-mapping.txt\` is R8's rename table for its flavor's build. A stack trace from it only becomes readable through the matching file (\`retrace <mapping.txt> <trace.txt>\`)." \
            --generate-notes

      # Play Console upload (internal track unless the PLAY_TRACK variable says otherwise). Skipped,
      # not failed, until the service-account key is set: the GitHub Release above is already out.
      # The first bundle for a new app must be uploaded by hand in the Play Console (CI_CD.md).
      - name: Publish to Google Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          if [ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
            echo "::notice::ANDROID_PUBLISHER_CREDENTIALS is not set - skipped the Google Play upload (see CI_CD.md → Releases)."
            exit 0
          fi
          ./gradlew :androidApp:publishPlaystoreReleaseBundle --stacktrace

  # ─── iOS → TestFlight (disabled) ────────────────────────────────────────────────────────────────
  # Off until the App Store Connect app and API key exist: set the repository variable
  # IOS_RELEASE_ENABLED to "true" to turn it on (CI_CD.md → iOS). Runs after the Android job, whose
  # ktlint and unit-test gate covers the shared code on this commit.
  testflight:
    name: iOS → TestFlight
    needs: release
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          missing=()
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$APP_STORE_CONNECT_KEY_ID" ] && missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -z "$APP_STORE_CONNECT_KEY_P8" ] && missing+=("APP_STORE_CONNECT_KEY_P8")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]} (see CI_CD.md → iOS)"
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Kotlin/Native caches
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Automatic signing through the API key: Xcode fetches (or creates) the distribution
      # certificate and App Store profile itself, so no .p12 or profile lives in the repo or secrets.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NetWorth.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            TEAM_ID="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # ExportOptions.plist has destination "upload": exporting sends the build to App Store
      # Connect, where it appears in TestFlight once processed.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NetWorth.xcarchive" \
            -exportOptionsPlist iosApp/Configuration/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
