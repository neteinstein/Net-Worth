name: Release

# Every push to main (and manual runs) builds the signed "github" flavor and publishes it as a GitHub
# Release tagged v1.0.<run number>: the APK and R8's mapping file. (Play Console publishing arrives
# with a "playstore" flavor — see androidApp/build.gradle.kts and CI_CD.md.)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  VERSION_NAME: "1.0.${{ github.run_number }}"
  # Google sign-in client ids compiled into GoogleConfig (docs/google-cloud-setup.md). Optional: when
  # absent the app builds, and "Sign in with Google" says it isn't configured.
  NETWORTH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NETWORTH_GOOGLE_WEB_CLIENT_ID }}
  NETWORTH_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NETWORTH_GOOGLE_IOS_CLIENT_ID }}
  NETWORTH_GOOGLE_API_KEY: ${{ secrets.NETWORTH_GOOGLE_API_KEY }}
  NETWORTH_GOOGLE_PROJECT_NUMBER: ${{ secrets.NETWORTH_GOOGLE_PROJECT_NUMBER }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Fail fast, before spending CI time, if the signing secrets aren't set up (see CI_CD.md).
      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ] && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Action secrets: ${missing[*]} (see CI_CD.md → Releases)"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # PR Checks validated the PR branch, but a squash merge lands a commit on main that was never
      # itself built, so this is the only gate on the exact commit being released.
      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK (github flavor)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew :androidApp:assembleGithubRelease --stacktrace

      # PR Checks runs this too, but a squash merge can land a shrinker change on main that was never
      # built as a release: re-check before anything reaches users.
      - name: Verify obfuscation
        run: ./scripts/verify-obfuscation.sh

      - name: Prepare release artifacts
        id: artifact
        run: |
          VERSION_UNDERSCORE="${VERSION_NAME//./_}"

          APK_PATH="androidApp/build/outputs/apk/github/release/NetWorth_version${VERSION_UNDERSCORE}-github.apk"
          mv androidApp/build/outputs/apk/github/release/androidApp-github-release.apk "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_sha1=$(sha1sum "$APK_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          # R8's rename table for this exact APK: without it a crash report from the build is
          # unreadable, and every build produces a different one.
          MAPPING_PATH="$RUNNER_TEMP/NetWorth_version${VERSION_UNDERSCORE}-github-mapping.txt"
          cp androidApp/build/outputs/mapping/githubRelease/mapping.txt "$MAPPING_PATH"
          echo "mapping_path=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          APK_SHA1: ${{ steps.artifact.outputs.apk_sha1 }}
          MAPPING_PATH: ${{ steps.artifact.outputs.mapping_path }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "$APK_PATH" \
            "$MAPPING_PATH" \
            --title "v${VERSION_NAME}" \
            --notes "**github flavor APK SHA-1:** \`${APK_SHA1}\`

          \`*-mapping.txt\` is R8's rename table for this release's APK. A stack trace from it only becomes readable through the matching file (\`retrace <mapping.txt> <trace.txt>\`)." \
            --generate-notes
