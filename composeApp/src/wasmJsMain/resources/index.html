<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0C111C" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Net Worth — your family’s finances in one shared Google Drive file.">
    <title>Net Worth</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- Lets the in-app language setting override the browser's (see core:designsystem LocalAppLocale). -->
    <script>
        var currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });
        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation);
    </script>
    <!-- Google sign-in (Identity Services) and the Google Picker, used by core:google on the web. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://apis.google.com/js/api.js" async></script>
    <!--
        composeApp.js has a fixed name and GitHub Pages lets browsers cache it for 10 minutes, so after a deploy an old
        copy would run against the new string files (see Main.kt). Load it fresh; the .wasm files it loads are named
        by their content hash and stay cached.
    -->
    <script>
        var app = document.createElement('script');
        app.src = 'composeApp.js?v=' + Date.now();
        document.head.appendChild(app);
    </script>
</head>

</body>
</html>
